<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452"
     role="img" aria-label="Kinstra Neko 架构：QQ 群消息经 OneBot 协议端进入插件，由群聊决策、消息中枢、记忆与人格处理，进入一群一会话的 DSH Session，回复再送回 QQ">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#100719"/>
      <stop offset="1" stop-color="#0b0d1c"/>
    </linearGradient>
    <filter id="gl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ahPink" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#ff7eb3"/>
    </marker>
    <marker id="ahCyan" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#67e8f9"/>
    </marker>
    <marker id="ahViolet" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="960" height="452" rx="16" fill="url(#bg)"/>

  <g font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <!-- ① QQ -->
    <rect x="180" y="24" width="600" height="56" rx="12" fill="#16202c" stroke="#67e8f9" stroke-width="1.5"/>
    <text x="208" y="50" font-size="17" font-weight="700" fill="#cdf3ff">QQ 群聊 · 小号（User 账号）</text>
    <text x="208" y="70" font-size="12.5" fill="#7f93ad">群消息 / @ / 引用 / 拍一拍</text>
    <text x="752" y="58" text-anchor="end" font-size="12" fill="#67e8f9">①</text>

    <line x1="480" y1="82" x2="480" y2="102" stroke="#67e8f9" stroke-width="2" marker-end="url(#ahCyan)"/>

    <!-- ② 协议端 -->
    <rect x="180" y="104" width="600" height="56" rx="12" fill="#1a1430" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="208" y="130" font-size="17" font-weight="700" fill="#ddd2ff">OneBot v11 协议端</text>
    <text x="208" y="150" font-size="12.5" fill="#9486b8">NapCat（安装器自动托管） · 任意 OneBot v11 兼容实现</text>
    <text x="752" y="138" text-anchor="end" font-size="12" fill="#a78bfa">②</text>

    <line x1="480" y1="162" x2="480" y2="182" stroke="#a78bfa" stroke-width="2" marker-end="url(#ahViolet)"/>

    <!-- ③ 插件主体 -->
    <rect x="180" y="184" width="600" height="148" rx="14" fill="#1d1028" stroke="#ff7eb3" stroke-width="2" filter="url(#gl)"/>
    <text x="208" y="212" font-size="17" font-weight="800" fill="#ffc2dd">Kinstra Neko 插件（DSH bundle）</text>

    <rect x="208" y="226" width="264" height="42" rx="9" fill="#241430" stroke="#ff7eb3" stroke-opacity="0.55"/>
    <text x="224" y="245" font-size="13.5" font-weight="700" fill="#ffd0e4">群聊决策</text>
    <text x="224" y="261" font-size="11" fill="#a486a6">@必回 · 相关度插话 · 冷却/静默/防刷屏</text>

    <rect x="488" y="226" width="264" height="42" rx="9" fill="#241430" stroke="#a78bfa" stroke-opacity="0.55"/>
    <text x="504" y="245" font-size="13.5" font-weight="700" fill="#e4d8ff">消息中枢</text>
    <text x="504" y="261" font-size="11" fill="#a486a6">停顿分段 · 拆气泡 · 真@展开 · 拍一拍</text>

    <rect x="208" y="276" width="264" height="42" rx="9" fill="#241430" stroke="#67e8f9" stroke-opacity="0.55"/>
    <text x="224" y="295" font-size="13.5" font-weight="700" fill="#cdf3ff">长期记忆</text>
    <text x="224" y="311" font-size="11" fill="#8fa6bc">中文二元 BM25 · 遗忘曲线 · 热群 LRU</text>

    <rect x="488" y="276" width="264" height="42" rx="9" fill="#241430" stroke="#ff7eb3" stroke-opacity="0.55"/>
    <text x="504" y="295" font-size="13.5" font-weight="700" fill="#ffd0e4">人格与权限</text>
    <text x="504" y="311" font-size="11" fill="#a486a6">Markdown 人格卡 · 双 preset 工具隔离</text>

    <line x1="480" y1="334" x2="480" y2="354" stroke="#ff7eb3" stroke-width="2" marker-end="url(#ahPink)"/>

    <!-- ④ DSH Session -->
    <rect x="180" y="356" width="600" height="56" rx="12" fill="#1a1430" stroke="#cbb8ff" stroke-width="1.5"/>
    <text x="208" y="382" font-size="17" font-weight="700" fill="#e6dcff">DeepSeek Harness · 一群一会话</text>
    <text x="208" y="402" font-size="12.5" fill="#9486b8">kinstra-social（纯聊天） / kinstra-private（主人完整工具） · 模型与密钥随 DSH 配置</text>
    <text x="752" y="390" text-anchor="end" font-size="12" fill="#cbb8ff">④</text>

    <!-- ⑤ 回流：回复送回 QQ；试运行只记录 -->
    <path d="M 780 384 C 900 384 906 52 782 52" fill="none" stroke="#ff7eb3" stroke-width="2"
          stroke-dasharray="6 5" marker-end="url(#ahPink)"/>
    <text x="893" y="232" text-anchor="middle" font-size="12" fill="#ff9ecb"
          transform="rotate(90 893 232)">回复拆条 → send_msg（试运行只写 observe）</text>
  </g>
</svg>
