# Kinstra Neko bundle layer：插入插件本体和两个猫娘会话 preset。
# profile 通过 stateDir 提供插件数据目录（见 installer 与 README）。
- insert:
    - id: kinstra-neko
      name: kinstra-neko
    # 主人私聊：人格独占系统提示词 + 完整工具（文件/终端/网页），compaction 阈值调小省内存。
    - id: preset-kinstra-private
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: kinstra-private
        name: Kinstra Neko · 主人私聊
        description: 猫娘和主人私聊时用：人格 + 完整工具，不供手动选择。
        order: 60
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: "{{kinstra_persona}}\n\n{{kinstra_rules_private}}"
              complete: true
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 6144
                  headChars: 3072
                  tailChars: 1024
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
    # 群聊 / 其他人私聊：只有人格，没有任何本地工具——猫娘就是猫娘，不是终端代理。
    - id: preset-kinstra-social
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: kinstra-social
        name: Kinstra Neko · 群聊
        description: 猫娘在 QQ 群和陌生人私聊时用：人格 + 纯聊天，无本地工具。
        order: 61
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: "{{kinstra_persona}}\n\n{{kinstra_rules_social}}"
              complete: true
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
